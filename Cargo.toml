[package]
name = "tslean"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/michaelknoch/TSLean"

[dependencies]
anyhow = "1.0.104"
audiopus = "0.2"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
core-text = "22.0.0"
cpal = "0.15"
dirs = "5"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
futures = "0.3"
global-hotkey = "0.6"
libc = "0.2.191"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slog = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util"] }
tsclientlib = "0.2"
tsproto-packets = "0.1"
unicode-segmentation = "1.13.3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
